[tools]
powershell-core = "7.4.15"

[tasks.install-analyzer]
description = "PSScriptAnalyzer をインストールする"
run = "pwsh -Command \"Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber\""

[tasks.lint]
description = "PSScriptAnalyzer でリポジトリ全体を静的解析する"
run = """
#!/usr/bin/env pwsh
Import-Module PSScriptAnalyzer
$results = Invoke-ScriptAnalyzer -Path . -Recurse -ExcludeRule PSUseBOMForUnicodeEncodedFile
$results | Format-Table RuleName, Severity, Line, ScriptName, Message -AutoSize
if ($results | Where-Object { $_.Severity -eq 'Error' }) { exit 1 }
"""
